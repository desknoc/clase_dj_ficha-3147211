{% extends "base.html" %}
{% block title %}Home Page | Guagua{% endblock title %}
{% block body %}
<div class="container py-5">
    {% if user.is_authenticated %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow bg-dark text-light border-secondary">
                <div class="card-body">
                    <h1 class="text-center md-4 mb-3">Bienvenidos a este CRM 😁☀️🌙</h1>
    {% else %}
                    <h1 class="text-center md-4 mb-3">Ingrese al sistema</h1>
                    <form action="{% url 'home' %}" method="POST">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="" class="form-label">Usuario</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" name="username" placeholder="Username" required />
                                <div class="col-md-6"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="" class="form-label">Cédula</label>
                                <input type="number" class="form-control bg-dark text-light border-secondary">
                                <div class="col-md-6"></div>
                            </div>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label for="" class="form-label">Contraseña</label>
                            <input type="password" class="form-control bg-dark text-light border-secondary" name="password" placeholder="Password" required>
                            <div class="col-md-6"></div>
                        </div>
                        <button class="col-md-1 btn btn-outline-light">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
    {% endif %}

{% endblock body %}
