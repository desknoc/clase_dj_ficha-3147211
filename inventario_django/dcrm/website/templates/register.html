{% extends 'base.html' %}
{% block title %}Registro{% endblock title %}
{% block body %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow bg-dark text-light border-secondary">
                <div class="card-body">
                    <h2 class="text-center mb-4">Registro</h2>
                    <form action="{% url 'register' %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="usernameInput" class="form-label">Usuario</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" name="username">
                        </div>
                        <div class="mb-3">
                            <label for="passwordInput" class="form-label">Contraseña</label>
                            <input type="password" class="form-control bg-dark text-light border-secondary" name="password">
                        </div>
                        <button type="submit" class="btn btn-outline-light w-100">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock body %}
